name: Build Windows Installer (.exe & .msi)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      - name: Run full 9-module test suite
        run: .\gradlew.bat test --no-daemon

      - name: Package Windows .exe and .msi installers (jpackage)
        run: .\gradlew.bat :desktop-app:packageExe :desktop-app:packageMsi --no-daemon

      - name: Upload Windows .exe Installer
        uses: actions/upload-artifact@v4
        with:
          name: LogicLabs-Windows-Installer-EXE
          path: desktop-app/build/compose/binaries/main/exe/*.exe

      - name: Upload Windows .msi Installer
        uses: actions/upload-artifact@v4
        with:
          name: LogicLabs-Windows-Installer-MSI
          path: desktop-app/build/compose/binaries/main/msi/*.msi
